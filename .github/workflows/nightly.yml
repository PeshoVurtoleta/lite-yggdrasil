# nightly.yml -- lite-yggdrasil daily run on the newest node and node 22 (.handoff/PLAN-ci.md, burst 42; rulings
# Y-CI-1..4). Y-CI-2: the full `npm run verify` (npm test + test:types + the standalone test:lanes, torture and
# kernel-lane scripts). Keep the step list in sync with ci.yml. Y-CI-3: node 'latest' and node 22 (check-latest: the
# newest 22.x every night) x ubuntu-latest / macos-latest: 4 legs. No Windows.
# Y-CI-1 (tier): DETERMINISTIC gates only (correctness, exact counts, allocation / GC count lanes, torture zero-GC).
# NOT gated: any timing / statistical claim (RULED Y-13 "none: statistical claims are REPORTED only"; a hosted
# runner is not a decisions/0003 G-3 host), the bench scripts; no quiet lock, no timing threshold or statistical gate
# (npm test's watchdog timeouts and its one conditional timing assert: see ci.yml).
# A failure in a count gate is a DETERMINISTIC-tier test bug to fix, never re-run for green. The allocation,
# --print-bytecode and --allow-natives-syntax rows are calibrated on node 26.8.2 (see ci.yml); 'latest' and 22 may
# disagree: record leg / row / observed vs expected. The npm test part expects the one R-A9 skip of ci.yml.
# A nightly failure turns the nightly red; it is never a required check for a push. GitHub runs a schedule only
# from the default branch and pauses it after 60 days without repository activity (re-enable in the Actions tab).
# Y-CI-4 (deps): no lockfile, no npm cache; `npm ls --depth=0` (MUST exit 0) records the devDependency versions
# tested. fetch-depth 0: as in ci.yml.
# timeout-minutes 180 is nominal (an estimate, not a sum): ci.yml's 120 plus 60 for test:types and the verify tails
# (test:lanes, torture, kernel-lane); only torture's children carry ceilings (test/torture-alloc.mjs:62 180 s,
# test/torture-jit.mjs:60 60 s per child); test:lanes and kernel-lane run in-process with none.

name: nightly

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    name: nightly (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # nominal, see the header
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['latest', '22']
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # no lockfile: no clean-install step, no npm cache (Y-CI-4)
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - name: provenance
        run: |
          node --version
          npm --version
          git --version
          uname -a
          git rev-parse HEAD
          node -p "'availableParallelism ' + os.availableParallelism() + ', loadavg ' + os.loadavg().join(' ')"
      - name: npm install
        run: npm install --no-audit --no-fund
      # deps provenance: the devDependency versions this run tested; MUST exit 0
      - name: deps provenance (npm ls --depth=0)
        run: npm ls --depth=0
      # informational only, not a gate: the full tree may exit non-zero on peer / optional noise
      - name: deps tree (npm ls --all, informational)
        run: npm ls --all || echo "npm ls --all exited $? (informational only, not a gate)"
      - name: npm run verify
        run: npm run verify
      # R-LU1 slot: the lite-utils tools' --self-test rows land here after the LiteUtils release (FILLERS item);
      # none run yet.
